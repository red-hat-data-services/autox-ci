pipeline:
  compile: {}

run:
  top_n: 3
  # Sweep both AutoML presets (speed + balanced). Override with --presets or BENCHMARK_PRESETS.
  presets: [speed, balanced]
  poll_interval_seconds: 30
  timeout_seconds: 86400
  enable_caching: false
  run_name_prefix: "benchmark"

datasets:
  # Binary classification
- id: breast_w
  name: breast_w
  train_data_file_key: "datasets/ml/classification/binary/breast_w.csv"
  label_column: "Class"
  task_type: "binary"

- id: bank_marketing
  name: bank_marketing
  train_data_file_key: "datasets/ml/classification/binary/bank_marketing.csv"
  label_column: "Class"
  task_type: "binary"

- id: jm1
  name: jm1
  train_data_file_key: "datasets/ml/classification/binary/jm1.csv"
  label_column: "defects"
  task_type: "binary"

  # Multiclass classification
- id: letter
  name: letter
  train_data_file_key: "datasets/ml/classification/multiclass/letter.csv"
  label_column: "class"
  task_type: "multiclass"

- id: optdigits
  name: optdigits
  train_data_file_key: "datasets/ml/classification/multiclass/optdigits.csv"
  label_column: "class"
  task_type: "multiclass"

  # Regression
- id: boston
  name: boston
  train_data_file_key: "datasets/ml/regression/boston.csv"
  label_column: "MEDV"
  task_type: "regression"

- id: wine_quality
  name: wine_quality
  train_data_file_key: "datasets/ml/regression/wine_quality.csv"
  label_column: "quality"
  task_type: "regression"

- id: kin8nm
  name: kin8nm
  train_data_file_key: "datasets/ml/regression/kin8nm.csv"
  label_column: "y"
  task_type: "regression"

- id: cpu_act
  name: cpu_act
  train_data_file_key: "datasets/ml/regression/cpu_act.csv"
  label_column: "usr"
  task_type: "regression"

- id: houses
  name: houses
  train_data_file_key: "datasets/ml/regression/houses.csv"
  label_column: "median_house_value"
  task_type: "regression"

  # Timeseries
- id: monthly_sunspots
  name: monthly_sunspots
  train_data_file_key: "datasets/ml/timeseries/monthly_sunspots.csv"
  task_type: "timeseries"
  id_column: "series_id"
  timestamp_column: "Month"
  target: "Sunspots"

  # bigger dataset (44Mb)
- id: higgs
  name: higgs
  train_data_file_key: "datasets/ml/classification/binary/higgs.csv"
  label_column: "class"
  task_type: "binary"
